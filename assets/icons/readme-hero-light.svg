<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" fill="none">
  <!-- PepCore Labs README Hero Banner (Light Mode Variant) -->
  <defs>
    <linearGradient id="bg-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="accent-line-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Banner Outer Container -->
  <rect x="2" y="2" width="796" height="196" rx="14" fill="url(#bg-grad-light)" stroke="#CBD5E1" stroke-width="2" />
  
  <!-- Top Accent Stripe -->
  <rect x="2" y="2" width="796" height="4" rx="2" fill="url(#accent-line-light)" />

  <!-- Background Decorative Molecular Grid (Subtle Slate for Light Mode) -->
  <g opacity="0.25" stroke="#0284C7" stroke-width="1.5" stroke-dasharray="4,4">
    <line x1="520" y1="30" x2="580" y2="65" />
    <line x1="580" y1="65" x2="640" y2="30" />
    <line x1="640" y1="30" x2="700" y2="65" />
    <line x1="700" y1="65" x2="760" y2="30" />
    <line x1="580" y1="65" x2="580" y2="135" />
    <line x1="700" y1="65" x2="700" y2="135" />
    <line x1="580" y1="135" x2="640" y2="170" />
    <line x1="640" y1="170" x2="700" y2="135" />
    <line x1="520" y1="170" x2="580" y2="135" />
  </g>
  <g fill="#0284C7" opacity="0.3">
    <circle cx="520" cy="30" r="4" />
    <circle cx="580" cy="65" r="5" />
    <circle cx="640" cy="30" r="4" />
    <circle cx="700" cy="65" r="5" />
    <circle cx="760" cy="30" r="4" />
    <circle cx="580" cy="135" r="5" />
    <circle cx="640" cy="170" r="4" />
    <circle cx="700" cy="135" r="5" />
  </g>

  <!-- Left Emblem: PepCore Brandmark -->
  <g transform="translate(42, 36)">
    <!-- Hexagonal Frame -->
    <polygon points="60,8 102,32 102,80 60,104 18,80 18,32" fill="#0F172A" stroke="#0284C7" stroke-width="2" />
    <polygon points="60,14 96,35 96,77 60,98 24,77 24,35" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.5" />
    
    <!-- Peptide "P" Structure -->
    <path d="M 43 85 V 33 H 70 C 79 33 85 39 85 47 C 85 55 79 61 70 61 H 43" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 70 61 L 83 75" fill="none" stroke="#0D9488" stroke-width="5" stroke-linecap="round" />

    <!-- Molecular Nodes -->
    <circle cx="43" cy="33" r="6" fill="#38BDF8" />
    <circle cx="70" cy="33" r="6" fill="#38BDF8" />
    <circle cx="85" cy="47" r="6" fill="#38BDF8" />
    <circle cx="70" cy="61" r="6" fill="#38BDF8" />
    <circle cx="43" cy="61" r="4.5" fill="#FFFFFF" />
    <circle cx="43" cy="85" r="6" fill="#38BDF8" />
    <circle cx="83" cy="75" r="6" fill="#10B981" />
  </g>

  <!-- Title & Branding Text -->
  <text x="185" y="74" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#0F172A" letter-spacing="3">PEPCORE LABS</text>
  <text x="185" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#0284C7" letter-spacing="3.5">RESEARCH PEPTIDES • LABORATORY SPECIFICATION</text>

  <!-- Specification Badges / Pills -->
  <!-- Pill 1: RUO -->
  <g transform="translate(185, 124)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.2" />
    <circle cx="14" cy="14" r="4" fill="#0284C7" />
    <text x="26" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#0F172A" letter-spacing="1">RESEARCH USE ONLY</text>
  </g>

  <!-- Pill 2: Purity -->
  <g transform="translate(357, 124)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="1.2" />
    <circle cx="14" cy="14" r="4" fill="#059669" />
    <text x="26" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#047857" letter-spacing="1">99.8%+ PURITY (HPLC/MS)</text>
  </g>

  <!-- Pill 3: EU Origin -->
  <g transform="translate(539, 124)">
    <rect x="0" y="0" width="140" height="28" rx="14" fill="#FFFFFF" stroke="#64748B" stroke-width="1.2" />
    <circle cx="14" cy="14" r="4" fill="#64748B" />
    <text x="26" y="18" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#334155" letter-spacing="1">EU MANUFACTURED</text>
  </g>
</svg>
