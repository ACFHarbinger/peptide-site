site_name: peptide-site Documentation
site_description: >-
  Documentation portal for peptide-site (PepCore Labs), a statically-exported Next.js research-peptide storefront.
site_author: ACFHarbinger
repo_url: https://github.com/ACFHarbinger/peptide-site
repo_name: ACFHarbinger/peptide-site
edit_uri: edit/main/docs/

docs_dir: .
site_dir: ../site

theme:
  name: material
  palette:
    - scheme: default
      primary: green
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: green
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - search.suggest
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

nav:
  - Home: index.md
  - Architecture: ARCHITECTURE.md
  - Development: DEVELOPMENT.md
  - Testing: TESTING.md
  - Glossary: GLOSSARY.md
  - Troubleshooting: TROUBLESHOOTING.md
  - Dependency Policy: DEPENDENCY_POLICY.md
  - Documentation Standards: DOCUMENTATION_STANDARDS.md
  - Benchmarks: BENCHMARKS.md
  - Security: SECURITY.md
  - Architecture Decisions:
      - 0001 Record Architecture Decisions: adr/0001-record-architecture-decisions.md
      - 0002 Static Export Deployment: adr/0002-static-export-deployment.md
      - 0003 Astro Island Boundary: adr/0003-astro-island-boundary.md
      - 0004 Checkout Hosted Redirect: adr/0004-checkout-hosted-redirect.md
      - 0005 Accounts via Firebase Auth: adr/0005-accounts-firebase-auth.md
      - 0006 Catalog Typed Repo Data: adr/0006-catalog-typed-repo-data.md
      - 0007 COA Placeholder First: adr/0007-coa-placeholder-first.md
  - Roadmap:
      - Overview: moon/ROADMAP.md
      - Changelog: moon/CHANGELOG.md
